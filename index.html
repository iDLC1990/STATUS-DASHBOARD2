<style>
body {
background: url('https://raw.githubusercontent.com/iDLC1990/status-dashboard/main/pexels-iriser-1366957.jpg')
no-repeat center center fixed;

.header {

/* --- ОБНОВЛЕННЫЕ СТИЛИ: ИДЕАЛЬНАЯ ПОДГОНКА БЕЗ СКРОЛЛА --- */
.table-container {
width: 95%;
max-width: 1200px;
margin: 24px auto;
transition: all 0.4s ease-in-out;
}

.fullscreen-mode {
position: fixed !important;
top: 0 !important;
left: 0 !important;
width: 100vw !important;
height: 90vh !important;
z-index: 9999 !important;
background: rgba(0, 0, 0, 0.4) !important;
backdrop-filter: blur(8px);
display: flex !important;
flex-direction: column !important;
justify-content: center !important;
align-items: center !important;
margin: 0 !important;
max-width: none !important;
overflow: hidden !important;
}

.fullscreen-mode #overview-block {
width: 90vw !important;
height: 90vh !important; /* Строго 95% от высоты экрана */
display: flex !important;
flex-direction: column !important;
overflow: hidden !important; /* Никакого скролла */
border-radius: 10px;
box-shadow: 0 0 30px rgba(0, 128, 128, 0.5);
}

/* Шапка не сжимается */
.fullscreen-mode .table-header {
flex-shrink: 0; 
padding: 1.5vh 2vw !important;
}

/* Таблица занимает все оставшееся место по вертикали */
.fullscreen-mode table {
flex-grow: 1; 
height: 100% !important; 
background-color: rgba(20, 20, 20, 0.95);
margin: 0;
}

/* Умные ячейки: шрифты и отступы зависят от высоты экрана */
.fullscreen-mode th, 
.fullscreen-mode td {
padding: 0.3vh 1vw !important; /* Сжимаем вертикальный отступ */
font-size: min(1.2vw, 2.5vh) !important; /* Шрифт адаптируется под высоту */
height: 1% !important; /* CSS-трюк: равномерно делит высоту между всеми строками */
}

@media (max-width: 1200px) {
    .fullscreen-mode th, 
    .fullscreen-mode td { font-size: min(14px, 2.5vh) !important; }
}
/* --- КОНЕЦ ОБНОВЛЕННЫХ СТИЛЕЙ --- */

#modal-content {

<script>
const apiKey = 'AIzaSyCP7tzYiGwIZ6cymLAlv_9QgPIEshnRgqI';
const sheetId = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
const sheetIdArchive = '1UWu4bcuHg6NHhK8ZvjDlQAIue6R1FLBlmAlBhHBj-D8';

let combinedDataCache = []; 

// Функция для выдачи кастомных иконок
function getUserCustomClass(name) {
    switch(name) {
        case 'KOVALCHYK Y.': return 'king-user';
        case 'KUKU O.': return 'owl-user';
        case 'BŁASZKOWSKA M.': return 'pl-user';
        case 'POKALCHUK A.': return 'flower-user';
        case 'NIKOLAIEV D.': return 'boxer-user';
        default: return '';
    }
}

const diagonalMapPrefix = {'WH8':55,'WC8':32,'WU0':43,'SQ1':43,'WM5':50,'WC7':32,'WP5':65,'WW1':75,'WM6':50};
const diagonalMapSuffix = {'860':86,'850':85,'750':75,'700':70,'650':65,'580':58,'575':58,'550':55,'545':55,'500':50,'498':50,'495':50,'490':50,'438':43,'435':43,'430':43,'428':43,'425':43,'420':43,'418':43,'415':43,'398':43,'395':43,'390':43,'348':32,'345':32,'340':32,'328':32,'325':32,'320':32,'318':32,'315':32,'278':27,'275':27,'270':27,'248':24,'245':24,'240':24,'238':24,'235':24,'230':24};

function extractDiagonal(serial) {
    if (!serial) return null;
    const s = serial.trim();
    return diagonalMapPrefix[s.substring(0, 3)] || 
           diagonalMapSuffix[s.substring(3, 6)] || 
           diagonalMapSuffix[s.slice(-3)] || null;
}

function buildSheetURL(spreadsheetId, sheetName) {
    return `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(sheetName)}?key=${apiKey}`;
}

async function getData(sheetName, spreadsheetId = sheetId) {
    try {
        const res = await fetch(buildSheetURL(spreadsheetId, sheetName));
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        return data.values || [];
    } catch (e) {
        console.error(`Fetch error ${sheetName}:`, e);
        return null; 
    }
}

async function fetchAndCacheData() {
    try {
        const [s1, s2, s3] = await Promise.all([
            getData('FI Station KOVALCHYK Y.', sheetId),
            getData('FI Station 2 ULANOVYCH.R', sheetId),
            getData('2024', sheetIdArchive)
        ]);

        if (!s1 && !s2) return false;

        const mapR = (r, insp) => ({
            date: r[0] || "", 
            serial: (r[2] || "").trim(), 
            type: (r[3] || "").trim().toUpperCase(), 
            status: r[4] || "",
            name: r[5] || "", 
            nameG: r[6] || "", 
            ocAfterRepair: r[9] || "", 
            comment: r[10] || "", 
            inspector: insp
        });

        combinedDataCache = [
            ...(s1 ? s1.slice(1) : []).map(r => mapR(r, 'KOVALCHYK Y.')),
            ...(s2 ? s2.slice(1) : []).map(r => mapR(r, 'ULANOVYCH.R')),
            ...(s3 ? s3.slice(1) : []).map(r => mapR(r, 'ARCHIVE'))
        ];
        return true;
    } catch (e) {
        console.error("Buffer update failed:", e);
        return false;
    }
}

function parseDatePart(val) {
    if (!val) return null;
    const first = val.split(' ')[0].trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(first)) return new Date(first);
    if (/^\d{2}\.\d{2}\.\d{4}$/.test(first)) {
        const [d,m,y] = first.split('.');
        return new Date(`${y}-${m}-${d}`);
    }
    const parsed = Date.parse(first);
    return isNaN(parsed) ? null : new Date(parsed);
}

function getLastDate(data) {
    const dates = data.map(r => parseDatePart(r.date)).filter(d => d instanceof Date && !isNaN(d));
    return dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : new Date();
}

const modal = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');
const modalClose = document.getElementById('modal-close');

if(modalClose) modalClose.onclick = () => modal.classList.remove('show');
if(modal) modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };

const secretBtn = document.getElementById('secret-btn-kovalchyk');
if(secretBtn) {
    secretBtn.onclick = () => {
        const dInfoText = document.getElementById('date-info').textContent;
        const lastDateStr = dInfoText.includes(':') ? dInfoText.split(':')[1].trim() : "";
        
        const records = combinedDataCache.filter(r => {
            const recordDate = parseDatePart(r.date);
            const isSameDay = recordDate && recordDate.toISOString().split('T')[0] === lastDateStr;
            return r.inspector === 'KOVALCHYK Y.' && 
                   isSameDay && 
                   ['OK','NDF','SCRAP TTL'].includes(r.status) &&
                   r.type !== 'MNT';
        });

        if (!records.length) return;

        const textToCopy = records.map(r => r.serial).join('\n');
        navigator.clipboard.writeText(textToCopy).then(() => {
            const oldSymbol = secretBtn.textContent;
            secretBtn.textContent = "✓";
            setTimeout(() => secretBtn.textContent = oldSymbol, 1200);
        });
    };
}

const bulkSearchBtn = document.getElementById('bulk-search-btn');
if(bulkSearchBtn) {
    bulkSearchBtn.onclick = () => {
        if(!modalBody || !modal) return;
        modalBody.innerHTML = `
            <h3 style="color:#0ff; margin-top:0;">Bulk Search</h3>
            <textarea id="bulk-input" placeholder="Wklej numery SN rozdzielone enterem..."></textarea>
            <button id="run-bulk-search">SZUKAJ</button>
            <div id="bulk-result" style="margin-top:20px;"></div>
        `;
        modal.classList.add('show');

        document.getElementById('run-bulk-search').onclick = () => {
            const inputVal = document.getElementById('bulk-input').value;
            const snList = inputVal.split('\n').map(s => s.trim().toUpperCase()).filter(s => s !== "");
            if(!snList.length) return;

            const groups = {};  
            const notFound = [];
 
            snList.forEach(sn => {
                const matches = combinedDataCache.filter(r => (r.serial || '').trim().toUpperCase() === sn);
                if(matches.length) {
                    matches.sort((a,b) => (parseDatePart(b.date) || 0) - (parseDatePart(a.date) || 0));
                    const record = matches[0];
                    const wName = record.name || 'UNKNOWN';
                    if(!groups[wName]) groups[wName] = [];
                    groups[wName].push(record);
                } else {
                    notFound.push(sn);
                }
            });
 
            const sortedNames = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
 
            let resHtml = "";
 
            sortedNames.forEach(name => {
                const userClass = getUserCustomClass(name);
                resHtml += `
                <details style="margin-bottom: 10px; border: 1px solid #008080; border-radius: 5px;">
                    <summary style="padding: 10px; cursor: pointer; background: rgba(0, 128, 128, 0.2); font-weight: bold;">
                        <span class="${userClass}" style="display:inline-flex;">${name}</span> — [${groups[name].length}]
                    </summary>
                    <table style="width: 100%; border-collapse: collapse; background: #222;">
                        <thead>
                            <tr style="background: #333;">
                                <th style="border: 1px solid #fff; padding: 10px;">Serial</th>
                                <th style="border: 1px solid #fff; padding: 10px;">Data</th>
                                <th style="border: 1px solid #fff; padding: 10px;">Status</th>
                                <th style="border: 1px solid #fff; padding: 10px;">Finalna</th> 
                                <th style="border: 1px solid #fff; padding: 10px;">OC</th>   
                                <th style="border: 1px solid #fff; padding: 10px;">Info</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${groups[name].map(r => `
                            <tr>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.serial}</td>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.date}</td>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.status}</td>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.nameG || ' '}</td>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.ocAfterRepair || ' '}</td>
                                <td style="border: 1px solid #fff; padding: 10px; text-align: center;">${r.comment}</td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </details>`;
            });

            if(notFound.length > 0) {
                resHtml += `
                <details style="margin-top: 20px; border: 1px solid #ff5555; border-radius: 5px;">
                    <summary style="padding: 10px; cursor: pointer; background: rgba(255, 85, 85, 0.2); color: #ff5555; font-weight: bold;">
                        NIE ZNALEZIONO — [${notFound.length} ]
                    </summary>
                    <div style="padding: 10px; color: #ff5555;">
                        ${notFound.join(', ')}
                    </div>
                </details>`;
            }

            document.getElementById('bulk-result').innerHTML = resHtml || "<p>NIE ZNALEZIONO</p>";
        };
    };
}

function openModal(name) {
    const dInfoText = document.getElementById('date-info').textContent;
    const lastDateStr = dInfoText.includes(':') ? dInfoText.split(':')[1].trim() : "";
    const records = combinedDataCache.filter(r => r.name === name && (r.date || '').split(' ')[0] === lastDateStr);

    if (!records.length) {
        modalBody.innerHTML = "<p>Brak danych dla wyбранego работника на dzisiaj.</p>";
    } else {
        let html = '<table><tr><th>Serial</th><th>Type</th><th>Status</th><th>OC</th><th>COMMENT</th></tr>';
        records.forEach(r => {
            html += `<tr><td>${r.serial || '--'}</td><td>${r.type || '--'}</td><td>${r.status || '--'}</td><td>${r.ocAfterRepair || '--'}</td><td>${r.comment || '--'}</td></tr>`;
        });
        modalBody.innerHTML = html + '</table>';
    }
    modal.classList.add('show');
}

function displayCombinedStats(filtered) {
    const stats = {};
    let tNDF=0, tOK=0, tWAIT=0, tTTL=0, tPNLA=0, gTotal=0;
    
    filtered.forEach(r => {
        const n = r.name || 'UNKNOWN';
        if (!stats[n]) stats[n] = { NDF:0, OK:0, WAITING:0, 'SCRAP TTL':0, 'SCRAP PNLA':0, total:0 };
        if (r.status === "NDF") { stats[n].NDF++; tNDF++; }
        if (r.status === "OK") { stats[n].OK++; tOK++; }
        if (r.status === "WAITING") { stats[n].WAITING++; tWAIT++; }
        if (r.status === "SCRAP TTL") { stats[n]["SCRAP TTL"]++; tTTL++; }
        if (r.status === "SCRAP PNLA") { stats[n]["SCRAP PNLA"]++; tPNLA++; }
        stats[n].total++; gTotal++;
    });
    
    const tbody = document.querySelector('#combined-table tbody');
    tbody.innerHTML = "";
    
    Object.entries(stats)
        .sort((a, b) => a[1].OK - b[1].OK)
        .forEach(([name, data]) => {
            const row = document.createElement('tr');
            const userClass = getUserCustomClass(name);
            const nameAttr = userClass ? `class="${userClass}"` : '';
            
            row.innerHTML = `<td onclick="openModal('${name}')" ${nameAttr}>${name}</td><td>${data.NDF}</td><td>${data.OK}</td><td>${data.WAITING}</td><td>${data['SCRAP TTL']}</td><td>${data['SCRAP PNLA']}</td><td class="sum-col">${data.total}</td>`;
            tbody.appendChild(row);
        });
        
    const tr = document.createElement('tr'); 
    tr.className = "total-row";
    tr.innerHTML = `<td>TOTAL</td><td>${tNDF}</td><td>${tOK}</td><td>${tWAIT}</td><td>${tTTL}</td><td>${tPNLA}</td><td class="sum-col">${gTotal}</td>`;
    tbody.appendChild(tr);
}

function displayDiagonalStats(filtered) {
    const diagStats = {};
    filtered.forEach(({name, serial, status}) => {
        if (status !== "OK" && status !== "NDF") return;
        const diag = extractDiagonal(serial); if (!diag) return;
        const nm = name || 'UNKNOWN';
        if (!diagStats[nm]) diagStats[nm] = {};
        diagStats[nm][diag] = (diagStats[nm][diag] || 0) + 1;
    });
    const tbody = document.querySelector('#diag-table tbody');
    const thead = document.querySelector('#diag-table thead');
    const allDiagonals = [...new Set(Object.values(diagStats).flatMap(o => Object.keys(o)))].map(Number).sort((a,b)=>a-b);
    thead.innerHTML = `<tr><th>NAME</th>${allDiagonals.map(d => `<th>${d}</th>`).join('')}<th class="sum-col">SUMA</th></tr>`;
    tbody.innerHTML = '';
    Object.entries(diagStats).sort().forEach(([name, diags]) => {
        const row = document.createElement('tr');
        const userClass = getUserCustomClass(name);
        const nameAttr = userClass ? `class="${userClass}"` : '';
        
        row.innerHTML = `<td ${nameAttr}>${name}</td>` + allDiagonals.map(d => `<td>${diags[d]||0}</td>`).join('') + `<td class="sum-col">${Object.values(diags).reduce((a,b)=>a+b,0)}</td>`;
        tbody.appendChild(row);
    });
}

function startLiveClock() {
    const clockElement = document.getElementById('live-clock');
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        clockElement.textContent = `${hours}:${minutes}:${seconds}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
}

startLiveClock();
    
document.getElementById('search').onkeypress = async e => {
    if (e.key === 'Enter') {
        const serial = e.target.value.trim().toUpperCase();
        const output = document.getElementById('search-result');
        if (!serial) {
            output.innerHTML = "";
            return;
        }
        const matches = combinedDataCache.filter(r => (r.serial || '').trim().toUpperCase() === serial).sort((a,b) => (parseDatePart(b.date)||0) - (parseDatePart(a.date)||0));
        if (matches.length) {
            output.innerHTML = `<table><thead><tr><th>Data</th><th>Status</th><th>NAPRAWIACZ</th><th>FINALNA</th><th>INFO</th></tr></thead>
            <tbody>${matches.map((d, i) => {
                const userClass = getUserCustomClass(d.name);
                return `<tr ${i===0?'class="latest-record"':''}><td>${d.date}</td><td>${d.status}</td><td class="${userClass}">${d.name}</td><td>${d.nameG}</td><td>${d.comment}</td></tr>`
            }).join('')}</tbody></table>`;
        } else { 
            output.innerHTML = "<p style='color:yellow'>Brak info!</p>"; 
        }
    }
};

async function updateStats() {
    if (await fetchAndCacheData()) {
        const lastDate = getLastDate(combinedDataCache);
        const lastDateStr = lastDate.toISOString().split('T')[0];
        document.getElementById('date-info').textContent = `DATE: ${lastDateStr}`;
        const filtered = combinedDataCache.filter(r => (r.date || '').split(' ')[0] === lastDateStr);
        displayCombinedStats(filtered);
        displayDiagonalStats(filtered);
    }
}

document.getElementById('diag-toggle').onclick = () => {

window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') modal.classList.remove('show');
        return;
    }
    if (e.altKey) {
        if (e.code === 'Digit1' || e.key === '1') {
            e.preventDefault();
            const b = document.getElementById('overview-block');
            const isHidden = window.getComputedStyle(b).display === 'none';
            b.style.display = isHidden ? 'block' : 'none';
        }
        if (e.code === 'Digit2' || e.key === '2') {
            e.preventDefault();
            const b = document.getElementById('diag-block');
            b.parentElement.style.display = 'block';
            const isHidden = window.getComputedStyle(b).display === 'none';
            b.style.display = isHidden ? 'block' : 'none';
        }
    }
    if (e.key === 'Escape') {
        modal.classList.remove('show');
    }
}, true);  

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW Registered!', reg))
      .catch(err => console.log('SW Error:', err));
  });
}

document.getElementById('main-title').onclick = () => {
    const overviewContainer = document.getElementById('overview-block').parentElement;
    const diagContainer = document.getElementById('diag-block').parentElement;

    if (!overviewContainer.classList.contains('fullscreen-mode')) {
        overviewContainer.classList.add('fullscreen-mode');
        if(diagContainer) diagContainer.style.display = 'none'; 
        document.body.style.overflow = 'hidden'; 
    } else {
        overviewContainer.classList.remove('fullscreen-mode');
        if(diagContainer) diagContainer.style.display = 'block';
        document.body.style.overflow = 'auto'; 
    }
};
